# Conda environment for the RII / MHPR paper (vision + LLM experiments).
# Usage:  conda env create -f environment.yml  &&  conda activate rii_unlearning
name: rii_unlearning
channels:
  - conda-forge
  - pytorch
dependencies:
  - python=3.10
  - pip
  # Vision / core experiments
  - pytorch>=2.0
  - torchvision>=0.15
  - numpy>=1.24
  - matplotlib>=3.7
  - scikit-learn>=1.3
  - pandas>=2.0
  - tqdm>=4.65
  - pip:
      # LLM experiments (Apple Silicon; see benchmark_llm_tofu_mlx.py)
      - mlx
      - mlx-lm
